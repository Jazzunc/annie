<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annie's List</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
        }
        h1 { text-align: center; color: #ffffff; margin-bottom: 12px; }
        
        /* Subtitle banner */
        p.subtitle { 
            text-align: center; 
            color: #d0d0d0; 
            font-size: 1.0rem; 
            font-weight: 500;
            background: #1e1e1e;
            border: 1px solid #333;
            display: table;
            margin: 0 auto 30px auto;
            padding: 6px 16px;
            border-radius: 20px;
        }
        
        .wishlist-container { display: flex; flex-direction: column; gap: 16px; }
        
        .wishlist-item-wrapper {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 10px;
            overflow: hidden;
            transition: border-color 0.2s;
        }
        .wishlist-item-wrapper:hover { border-color: #555; }

        .wishlist-item {
            padding: 20px;
            display: flex;
            gap: 16px;
            align-items: center;
        }
        .rank { font-size: 1.4rem; font-weight: bold; color: #888; min-width: 28px; text-align: center; line-height: 1.2; }

        .item-details { flex-grow: 1; min-width: 0; }
        
        /* Line 1: Title */
        .item-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 2px;
        }
        
        /* Line 2: Subtitle in Coral */
        .item-subtitle {
            font-size: 0.88rem;
            font-weight: 500;
            color: #ffab91;
            margin-bottom: 6px;
        }

        /* Line 3: Standard Description */
        .item-desc {
            font-size: 0.88rem;
            color: #b0b0b0;
            line-height: 1.4;
        }

        /* Action Buttons */
        .item-meta {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            flex-shrink: 0;
        }
        .mood-btn {
            padding: 8px 16px;
            border-radius: 6px;
            background: #2a2a2a;
            color: #ffffff;
            border: 1px solid #b388ff;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        .mood-btn:hover {
            background: #3b2d54;
            border-color: #d1b3ff;
        }

        /* Green accent button for plant pot */
        .mood-btn.green-btn {
            border-color: #81c784;
        }
        .mood-btn.green-btn:hover {
            background: #2e4a32;
            border-color: #a5d6a7;
        }

        /* Expandable Mood Board Image Container - Full Width Fit */
        .mood-board-expand {
            display: none;
            padding: 0 20px 20px 20px;
            border-top: 1px dashed #333;
            background: #181818;
            text-align: center;
        }
        .mood-board-expand.active { display: block; }
        .mood-board-expand img {
            width: 100%;
            height: auto;
            max-height: none;
